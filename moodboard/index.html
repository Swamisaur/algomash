<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Moodboard</title>
<style>
:root{--bg:#0e0e10;--fg:#f2f2f2;--mute:#8a8a90;--card:#18181b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:48px 24px}
header{max-width:1400px;margin:0 auto 40px}
h1{font-size:clamp(28px,4vw,44px);font-weight:500;letter-spacing:-.02em}
header p{color:var(--mute)}
.grid{max-width:1400px;margin:0 auto;columns:3 380px;column-gap:20px}
figure{break-inside:avoid;margin-bottom:20px;background:var(--card);border-radius:14px;overflow:hidden;cursor:zoom-in}
figure img{width:100%;display:block;transition:transform .4s}
figure:hover img{transform:scale(1.02)}
figcaption{padding:12px 16px;display:flex;justify-content:space-between;gap:12px}
figcaption b{font-weight:500}figcaption span{color:var(--mute);font-size:13px;text-align:right}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px}
</style></head><body>
<header><h1>Website Moodboard</h1><p>Algomash · hero references</p></header>
<main class="grid">
<figure><img src="01-pelmatech-blue.png" alt=""><figcaption><b>Pelmatech — blue</b><span>Reeded-glass blur, glass cards</span></figcaption></figure>
<figure><img src="02-fluxedit.png" alt=""><figcaption><b>FluxEdit</b><span>Light-beam gradient, serif italic</span></figcaption></figure>
<figure><img src="03-solix.png" alt=""><figcaption><b>Solix</b><span>Pixel field, floating UI cards</span></figcaption></figure>
<figure><img src="04-arc-finance.png" alt=""><figcaption><b>Arc</b><span>Monochrome pink, 3D object hero</span></figcaption></figure>
<figure><img src="05-pelmatech-violet.png" alt=""><figcaption><b>Pelmatech — violet</b><span>Same system, warm/violet palette</span></figcaption></figure>
<figure><img src="06-kinetic.png" alt=""><figcaption><b>Kinetic</b><span>Motion blur, giant wordmark</span></figcaption></figure>
<figure><img src="07-upfluence.png" alt=""><figcaption><b>Upfluence</b><span>Condensed caps, shaped photo crops</span></figcaption></figure>
<figure><img src="08-rawables.png" alt=""><figcaption><b>Rawables</b><span>Condensed + serif italic pairing</span></figcaption></figure>
<figure><img src="09-visionary-intelligence.png" alt=""><figcaption><b>Visionary Intelligence</b><span>Soft gradient, glass slats</span></figcaption></figure>
</main>
<div id="lb"><img alt=""></div>
<script>
const lb=document.getElementById('lb'),li=lb.querySelector('img');
document.querySelectorAll('figure img').forEach(i=>i.parentElement.onclick=()=>{li.src=i.src;lb.classList.add('on')});
lb.onclick=()=>lb.classList.remove('on');
document.onkeydown=e=>{if(e.key==='Escape')lb.classList.remove('on')};
</script></body></html>
